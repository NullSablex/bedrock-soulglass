name: check

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks
        run: python tools/check.py

      - name: Build the add-on
        run: python build.py

      # Proof the package is installable, not merely that the build exited zero.
      - uses: actions/upload-artifact@v4
        with:
          name: soulglass-mcaddon
          path: dist/*.mcaddon
          if-no-files-found: error
