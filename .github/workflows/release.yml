name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ADDON_NAME: Soulglass

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Needs write access to create the release and upload the packages.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0   # full history so generate-notes can list every commit
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify manifest versions match the release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pack in behavior_packs/soulglass resource_packs/soulglass; do
            PACK_VERSION=$(python -c "import json,sys; print('.'.join(str(n) for n in json.load(open('$pack/manifest.json'))['header']['version']))")
            echo "${pack}: ${PACK_VERSION}"
            if [ "${TAG_VERSION}" != "${PACK_VERSION}" ]; then
              echo "::error::Release tag (${GITHUB_REF_NAME}) does not match ${pack} version (${PACK_VERSION})."
              echo "::error::Bump both manifests to ${TAG_VERSION} (or retag) and try again."
              exit 1
            fi
          done

      - name: Static checks
        run: python tools/check.py

      # Three packages: each half on its own, plus the combined installer.
      # Server owners want the halves; players want the one that just works.
      - name: Build packages
        run: python build.py --all

      - name: Build release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 1. Curated section from CHANGELOG.md — the parts a human wrote,
          # which no API can infer from commit titles.
          BODY=$(awk "/^## \[?v?${VERSION}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi

          # 2. Auto-generated notes, used only for the "New Contributors" block
          # and the "Full Changelog" link GitHub computes natively. The
          # categorised "What's Changed" list is dropped: the CHANGELOG already
          # does that job with more context.
          AUTO=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -q .body 2>/dev/null || echo "")

          APPENDIX=$(echo "$AUTO" | sed -n '/^## New Contributors$/,$p')
          if [ -z "$APPENDIX" ]; then
            APPENDIX=$(echo "$AUTO" | grep '^\*\*Full Changelog\*\*' | tail -1)
          fi

          # 3. Which file to download. Kept at the bottom so it does not push
          # the actual notes below the fold.
          FOOTER=$(cat <<EOF
          ### Downloads

          - \`${ADDON_NAME}_v${VERSION}.mcaddon\` — **start here.** Both packs in one file; opening it installs the lot.
          - \`${ADDON_NAME}_BP_v${VERSION}.mcpack\` — behavior pack only.
          - \`${ADDON_NAME}_RP_v${VERSION}.mcpack\` — resource pack only.

          The two \`.mcpack\` files are for server owners placing each half by hand. **Both are required** — the resource pack carries the translation strings, and without it every message shows as a raw key.

          Installation: see [the documentation](https://nullsablex.github.io/bedrock-soulglass/installation/).
          EOF
          )

          {
            echo "$BODY"
            if [ -n "$APPENDIX" ]; then
              printf '\n---\n\n%s\n' "$APPENDIX"
            fi
            printf '\n---\n\n%s\n' "$FOOTER"
          } > release_body.md

          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            dist/*.mcaddon
            dist/*.mcpack
          draft: false
          prerelease: false
