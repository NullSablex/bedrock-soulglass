name: Release Drafter

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# Default: nothing. The single job opts into exactly what it needs.
permissions: {}

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create and update the release draft
      pull-requests: read  # read titles and labels to generate the notes
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
