site_name: Soulglass
site_description: Death add-on for Minecraft Bedrock 1.26
site_url: https://nullsablex.github.io/bedrock-soulglass/
repo_url: https://github.com/NullSablex/bedrock-soulglass
repo_name: NullSablex/bedrock-soulglass
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - For players:
      - Installation: installation.md
      - Using the map: map.md
  - For server owners:
      - Configuration: configuration.md
      - Languages: languages.md
  - For developers:
      - Architecture: architecture.md
      - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NullSablex
